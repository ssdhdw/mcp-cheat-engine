name: MCP bridge tests
on:
  push:
    paths: ['mcp/**', '.github/workflows/mcp-tests.yml']
  pull_request:
    paths: ['mcp/**', '.github/workflows/mcp-tests.yml']
jobs:
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mcp/requirements-dev.txt
      - run: python -m unittest discover -s mcp -p 'test_*.py' -v
